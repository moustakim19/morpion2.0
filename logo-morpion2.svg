<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 130 130">
  <title>Morpion 2.0</title>
  <!-- Logo Morpion 2.0 « Aurore » : un X rose-violet et un O cyan-bleu sur un ciel de nuit -->
  <defs>
    <!-- Fond : nuit violette, plus claire en haut à gauche -->
    <radialGradient id="fond" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#2A2357"/>
      <stop offset="1" stop-color="#0A0918"/>
    </radialGradient>
    <!-- Dégradé du X : rose vers violet -->
    <linearGradient id="degrade-x" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8FD1"/>
      <stop offset="1" stop-color="#8B5CFF"/>
    </linearGradient>
    <!-- Dégradé du O : cyan vers bleu -->
    <linearGradient id="degrade-o" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF9FF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Le fond arrondi (forme d'icône d'appli) -->
  <rect width="130" height="130" rx="28" fill="url(#fond)"/>

  <!-- Lueurs douces autour du X et du O (traits larges et presque transparents) -->
  <path d="M27 49 L57 79 M57 49 L27 79" stroke="#FF8FD1" stroke-width="20" stroke-linecap="round" opacity="0.13"/>
  <circle cx="90" cy="64" r="16" fill="none" stroke="#7DF9FF" stroke-width="20" opacity="0.12"/>

  <!-- Le X -->
  <path d="M27 49 L57 79 M57 49 L27 79" stroke="url(#degrade-x)" stroke-width="10" stroke-linecap="round"/>
  <!-- Le O -->
  <circle cx="90" cy="64" r="16" fill="none" stroke="url(#degrade-o)" stroke-width="10"/>

  <!-- Reflets blancs, comme sur du verre -->
  <path d="M28.5 48 L40 59.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M79 54 A14 14 0 0 1 88 49.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Petites étoiles dans le ciel -->
  <circle cx="108" cy="30" r="1.3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="22" cy="104" r="1" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="100" cy="102" r="0.9" fill="#FFFFFF" opacity="0.5"/>
</svg>

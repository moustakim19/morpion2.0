<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Logo Morpion 2.0 : une tuile d'obsidienne, une grille et 5 gemmes alignées -->
  <defs>
    <!-- Dégradé du contour : violet → turquoise -->
    <linearGradient id="bord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C29BFF"/>
      <stop offset="1" stop-color="#6CF5E6"/>
    </linearGradient>
    <!-- Fond de la tuile : obsidienne avec un léger reflet en haut à gauche -->
    <radialGradient id="fond" cx="0.28" cy="0.2" r="0.95">
      <stop offset="0" stop-color="#3b2d66"/>
      <stop offset="0.55" stop-color="#1E1734"/>
      <stop offset="1" stop-color="#120d22"/>
    </radialGradient>
    <!-- Reflet blanc sur la table de la gemme -->
    <linearGradient id="reflet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- Flou pour la lueur de la ligne gagnante -->
    <filter id="lueur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <!-- La gemme taillée (vue de dessus, 8 facettes) -->
    <symbol id="g" viewBox="0 0 100 100">
      <polygon points="50,4 82.5,17.5 96,50 82.5,82.5 50,96 17.5,82.5 4,50 17.5,17.5" fill="currentColor"/>
      <polygon points="50,4 82.5,17.5 64,36 50,30" fill="#fff" opacity=".28"/>
      <polygon points="82.5,17.5 96,50 70,50 64,36" fill="#fff" opacity=".08"/>
      <polygon points="96,50 82.5,82.5 64,64 70,50" fill="#000" opacity=".18"/>
      <polygon points="82.5,82.5 50,96 50,70 64,64" fill="#000" opacity=".34"/>
      <polygon points="50,96 17.5,82.5 36,64 50,70" fill="#000" opacity=".22"/>
      <polygon points="17.5,82.5 4,50 30,50 36,64" fill="#000" opacity=".06"/>
      <polygon points="4,50 17.5,17.5 36,36 30,50" fill="#fff" opacity=".3"/>
      <polygon points="17.5,17.5 50,4 50,30 36,36" fill="#fff" opacity=".46"/>
      <polygon points="50,30 64,36 70,50 64,64 50,70 36,64 30,50 36,36" fill="currentColor"/>
      <polygon points="50,30 64,36 70,50 64,64 50,70 36,64 30,50 36,36" fill="url(#reflet)"/>
      <polygon points="39,38 50,33 47,44 37,48" fill="#fff" opacity=".75"/>
      <polygon points="50,4 82.5,17.5 96,50 82.5,82.5 50,96 17.5,82.5 4,50 17.5,17.5" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="1.6"/>
    </symbol>
  </defs>

  <!-- Tuile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#fond)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="url(#bord)" stroke-width="8"/>

  <!-- Grille discrète -->
  <g stroke="#fff" stroke-opacity=".08" stroke-width="3">
    <path d="M160 96V416M224 96V416M288 96V416M352 96V416"/>
    <path d="M96 160H416M96 224H416M96 288H416M96 352H416"/>
  </g>

  <!-- Gemmes adverses (turquoise) -->
  <use href="#g" x="98" y="162" width="60" height="60" color="#6CF5E6"/>
  <use href="#g" x="290" y="354" width="60" height="60" color="#6CF5E6"/>

  <!-- Ligne gagnante lumineuse -->
  <line x1="128" y1="384" x2="384" y2="128" stroke="#C29BFF" stroke-width="22" stroke-linecap="round" opacity=".55" filter="url(#lueur)"/>
  <line x1="128" y1="384" x2="384" y2="128" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/>

  <!-- 5 gemmes violettes alignées -->
  <use href="#g" x="94" y="350" width="68" height="68" color="#C29BFF"/>
  <use href="#g" x="158" y="286" width="68" height="68" color="#C29BFF"/>
  <use href="#g" x="216" y="216" width="80" height="80" color="#C29BFF"/>
  <use href="#g" x="286" y="158" width="68" height="68" color="#C29BFF"/>
  <use href="#g" x="350" y="94" width="68" height="68" color="#C29BFF"/>
</svg>
